# Solutions catalogue: the options a Question can offer. Each is a starting point with a stated
# source, never an engineering design (contracts/solutions.schema.json).
#
# cost: low | medium | high (relative, for ranking options against each other)
# check: what to confirm on the ground before acting

# ---------------------------------------------------------------- building on sinking ground

standard_foundation:
  title: "Standard foundation to the building code"
  what: "Design to Mexico City's foundation code for the plot's soil zone. The radar shows no unusual sinking or tilt here."
  cost: low
  source: "Gobierno de la Ciudad de México, Normas Técnicas Complementarias para Diseño y Construcción de Cimentaciones"
  check: "The soil study the code already requires for the plot's zone."

yearly_ground_check:
  title: "Re-check the ground every year"
  what: "Look at this plot again with each new year of NISAR data, or survey a levelling benchmark every 1 to 2 years. Sinking can start when nearby pumping changes."
  cost: low
  source: "Team practice; NISAR repeats every 12 days"
  check: "Compare the yearly speed with this year's."

flexible_connections:
  title: "Flexible joints where the building meets the street"
  what: "The whole block sinks together, so the building itself is safe, but pipes, drains, ramps and entrances tear where they meet the street. Use flexible pipe couplings and entrances that can be re-levelled."
  cost: low
  source: "General engineering practice for regional subsidence; confirm with a structural engineer"
  check: "Cracks at the junction of existing buildings and pavements on the same street."

compensated_foundation:
  title: "Compensated (floating) or raft foundation"
  what: "Dig out a weight of soil roughly equal to the building's weight, so the clay below carries almost no extra load. Widely used on Mexico City's lake clay."
  cost: medium
  source: "Zeevaert, Foundation Engineering for Difficult Subsoil Conditions (1983); Mexico City foundation code (NTC)"
  check: "Borehole or cone test for clay thickness and groundwater level."

light_flexible_structure:
  title: "Light, flexible building of 1 to 3 storeys"
  what: "A steel or timber frame tolerates uneven sinking far better than long rigid walls or tall masonry. Keep it short and light."
  cost: medium
  source: "Bjerrum (1963) tilt limits: frame buildings tolerate more tilt than rigid walls"
  check: "Structural engineer's review of the frame against the expected tilt."

avoid_rigid_tall:
  title: "Avoid tall or rigid buildings here"
  what: "The ground here is tilting fast enough to crack walls within about a decade. Tall, rigid or long buildings would need special foundations that may cost more than a better plot."
  cost: high
  source: "Bjerrum (1963): first cracks in walls at 1/300 tilt, structural damage at 1/150"
  check: "Levelling survey across the plot to confirm the tilt."

soil_study_first:
  title: "Detailed soil study and levelling before design"
  what: "Boreholes or cone tests for clay thickness, the groundwater level, and levelling benchmarks across the plot. The radar shows where to look; this shows what is below."
  cost: medium
  source: "Mexico City foundation code (NTC): soil exploration depends on the zone and the building"
  check: "This is the check."

choose_better_plot:
  title: "Look at the better plots nearby"
  what: "Ask the 'Better plots nearby?' question at this spot: it ranks the steadiest ground within 2 km."
  cost: low
  source: "SARAURA question m3_better_plots"
  check: "Visit the alternatives; confirm with a soil study."

more_data_needed:
  title: "Not enough radar data: survey it"
  what: "The radar could not measure this spot reliably (water, dense change or noisy signal). Use a levelling survey or a GNSS station instead."
  cost: low
  source: "Team rule: coherence below 0.3 or an unsteady fit is masked"
  check: "Levelling survey."

# ---------------------------------------------------------------- lines: Metro, light rail, canals

inspect_segment_first:
  title: "Inspect this segment first"
  what: "Survey track geometry, supports and tunnel or viaduct joints where the ground sinks unevenly along the line, starting with the fewest years to the limit."
  cost: medium
  source: "Bjerrum (1963) tilt limits applied along the line; rails are more sensitive than buildings"
  check: "Track geometry survey; crack mapping on supports and joints."

monitoring_points:
  title: "Add monitoring points on the structure"
  what: "Levelling benchmarks or GNSS on the structure, compared with each new NISAR Pass, to catch speeding up early."
  cost: low
  source: "Team practice"
  check: "Benchmarks agree with the radar speed within about 1 cm per year."

relevel_and_joints:
  title: "Re-level and fit adjustable joints"
  what: "Plan maintenance to re-level track and adjust joints and supports where uneven sinking will pass tolerance."
  cost: medium
  source: "General railway maintenance practice; confirm with the operator's standards"
  check: "The operator's track tolerances."

canal_gradient_check:
  title: "Survey the canal's gradient"
  what: "Drains and canals lose their slope as the ground sinks unevenly, and water stops flowing by gravity (documented for Mexico City's Gran Canal del Desagüe). Survey the bed slope and plan pumping."
  cost: medium
  source: "Mexico City drainage history; CONAGUA Túnel Emisor Oriente"
  check: "Levelling along the canal bed."

routine_watch:
  title: "Keep the routine checks"
  what: "No segment here is close to the limit. Keep the normal inspection cycle and compare with NISAR yearly."
  cost: low
  source: "Team practice"
  check: "Next scheduled inspection."

# ---------------------------------------------------------------- after a wildfire

log_erosion_barriers:
  title: "Log or brush barriers along the slope"
  what: "Lay burned trunks or brush across the slope, following the contour, to slow runoff and catch soil before it reaches channels."
  cost: medium
  source: "Robichaud, Ashmun & Sims (2010), Post-fire treatment effectiveness for hillslope stabilization, USDA Forest Service RMRS-GTR-240"
  check: "Field visit: bare soil, rills and loose ash on the slope."

mulch_steep_slopes:
  title: "Straw or wood mulch on the steepest burned ground"
  what: "Cover bare burned soil on the steepest slopes; mulch was the most effective hillslope treatment in US post-fire studies."
  cost: medium
  source: "Robichaud, Ashmun & Sims (2010), USDA Forest Service RMRS-GTR-240"
  check: "Ground cover left after the fire (bare soil share)."

clear_channels_culverts:
  title: "Clear channels and culverts before the rains"
  what: "Remove burned debris from stream channels and enlarge or clear culverts so mud and water pass under roads instead of over them."
  cost: low
  source: "USDA Forest Service BAER road and channel treatments"
  check: "Walk the channel from the burned slope down to the road or village."

warn_village:
  title: "Warn the village and agree a rain alert"
  what: "Tell residents below the burned slope, mark safe routes, and agree a rainfall level (from Office National de la Météorologie forecasts) at which people move away from the channel."
  cost: low
  source: "Staley et al. (2017): post-fire debris flows start at short, intense rain bursts"
  check: "Which houses sit in or beside the channel."

road_closure_trigger:
  title: "Close the road in heavy rain, with a loader on standby"
  what: "Agree a rain trigger to close the road section, a detour, and keep a loader near the crossing to clear mud quickly."
  cost: low
  source: "USDA Forest Service BAER road treatments; team practice"
  check: "Culvert size and condition at the crossing."

sediment_traps:
  title: "Small check dams or sediment traps in gullies"
  what: "Straw-bale or log check dams in small gullies hold back sediment before it reaches rivers, reservoirs and roads."
  cost: medium
  source: "Robichaud, Ashmun & Sims (2010), USDA Forest Service RMRS-GTR-240 (channel treatments)"
  check: "Gully size; check dams fail in large channels."

replant_native:
  title: "Replant with native species"
  what: "Plant native trees suited to the site (in Jijel's forests: cork oak, and pine where it grew before) from forestry-service nurseries, after the soil is protected."
  cost: high
  source: "Mediterranean post-fire restoration practice; local forestry service"
  check: "What grew here before the fire, and whether it is resprouting."

natural_regrowth:
  title: "Let it regrow and keep grazing out"
  what: "Cork oak and Mediterranean shrubs often resprout after fire. Protect the area from grazing for a few years instead of planting."
  cost: low
  source: "Cork oak resprouts from its bark after fire (Mediterranean forest ecology)"
  check: "Green shoots on trunks and stumps in spring."

protect_soil_first:
  title: "Protect the soil before planting"
  what: "On steep burned ground, seedlings wash away in the first winter. Put barriers or mulch in place first, plant after the rains."
  cost: medium
  source: "Robichaud, Ashmun & Sims (2010), USDA Forest Service RMRS-GTR-240"
  check: "Signs of erosion after the first heavy rain."

recheck_spring:
  title: "Check again in spring"
  what: "Autumn rain makes the ground wetter, which can look like regrowth on radar. Re-check after the rains and visit the patch."
  cost: low
  source: "Wet soil raises radar backscatter (NASA Earthdata SAR introduction)"
  check: "Field visit in March to May."

compensation_list:
  title: "Add to the compensation list"
  what: "Record burned hectares per field and farm for the local council's compensation process."
  cost: low
  source: "Team practice"
  check: "Field boundaries and owners."

# ---------------------------------------------------------------- farms after a wildfire (A5)

cover_burned_fields:
  title: "Cover burned fields before the rains"
  what: "Spread straw or sow a fast cover crop (barley or oats) on burned fields, and plough along the contour on slopes, so winter rain does not wash the topsoil away."
  cost: low
  source: "Shakesby (2011), Post-wildfire soil erosion in the Mediterranean, Earth-Science Reviews 105, 71-100: most soil is lost in the first autumn and winter storms"
  check: "Bare soil and ash left on the field; how steep it is."

orchard_tree_check:
  title: "Check orchard trees before cutting them down"
  what: "Fire-scorched olive and fruit trees often resprout from the trunk or the base. Scrape the bark near the ground: moist green wood underneath means the tree may live. Wait until spring before uprooting."
  cost: low
  source: "Agricultural extension practice for fire-damaged orchards; olive trees resprout from the base after fire"
  check: "Green wood under the bark at the trunk base; new shoots in spring."

firebreak_field_edge:
  title: "Keep a clear strip between the field and the forest"
  what: "A ploughed or grazed strip along the forest edge stops the next summer's fire from running into the field."
  cost: low
  source: "Mediterranean fire-prevention practice; local forestry service"
  check: "Dry grass and brush along the field edge before June."

# ---------------------------------------------------------------- rivers and dams after a wildfire (A7)

reservoir_turbidity_watch:
  title: "Watch turbidity at the dam and the water plant after storms"
  what: "Burned catchments send ash, sediment and nutrients into reservoirs in the first storms. Sample turbidity at the intake after each heavy rain and plan extra treatment, or draw from another depth or source while it is high."
  cost: low
  source: "Smith et al. (2011), Wildfire effects on water quality in forest catchments, Journal of Hydrology 396, 170-192"
  check: "Turbidity at the intake after the first big storm, compared with last winter."

riverbank_buffer:
  title: "Protect and replant the riverbanks first"
  what: "Keep grazing off the burned banks and replant a strip along the river below the burned slopes: living roots hold the banks and catch sediment before it reaches the water."
  cost: medium
  source: "Shakesby (2011), Earth-Science Reviews 105, 71-100; riparian buffer practice"
  check: "Burned or collapsing banks along the river below the fire."

river_normal_watch:
  title: "Keep the normal river watch"
  what: "Little of this river's catchment burned on steep ground, so the fire adds little sediment. Keep the usual flood and water-quality checks."
  cost: low
  source: "Team practice"
  check: "Next routine water-quality sample."

# ---------------------------------------------------------------- what changed since the last Pass (A9)

field_check_change:
  title: "Look at the changed patch on the ground"
  what: "A sudden radar change can be a new fire, cleared land, a slope that slipped or fresh mud. Send a team or check the next cloud-free optical image before acting."
  cost: low
  source: "Team practice; NISAR repeats every 12 days through cloud and smoke"
  check: "What is on the ground at the patch: scorch, cut trees, a scar on the slope, or mud."

notify_after_pass:
  title: "Send the changed patches to civil protection and the commune"
  what: "After each Pass, share the list of changed patches near villages and roads with the services that can act on them."
  cost: low
  source: "Team practice"
  check: "Who is responsible for each village and road on the list."

confirm_next_pass:
  title: "Confirm with the next Pass"
  what: "Rain on leaves or soil at the time of a Pass can change the signal for a day. If the change is still there 12 days later, it is real."
  cost: low
  source: "Wet soil and leaves raise radar backscatter (NASA Earthdata SAR introduction)"
  check: "The same patch on the next Pass."

# ---------------------------------------------------------------- after an earthquake

search_rescue_first:
  title: "Send search and rescue here first"
  what: "Start the search sectors in the blocks flagged high, then widen. Collapsed buildings in dense neighbourhoods are where trapped people are most likely."
  cost: medium
  source: "INSARAG Guidelines (2020), UN OCHA: assessment, search and rescue sectorisation"
  check: "Reports from residents and local responders; access roads open."

rapid_safety_tagging:
  title: "Rapid safety tagging of buildings (green, yellow, red)"
  what: "Trained engineers walk the flagged blocks and post a tag on each building: safe to enter, limited entry, or unsafe. It takes minutes per building and tells families whether they can go home."
  cost: low
  source: "ATC-20, Procedures for Postearthquake Safety Evaluation of Buildings (Applied Technology Council)"
  check: "Aftershock forecast before re-entry."

detailed_assessment:
  title: "Detailed engineering assessment"
  what: "For buildings tagged yellow or red: an engineer checks columns, joints and walls in detail and decides between repair, strengthening or demolition."
  cost: medium
  source: "ATC-20 detailed evaluation; FEMA P-2018, Seismic Evaluation of Older Concrete Buildings for Collapse Potential"
  check: "Structural drawings if available; signs of column shear cracks."

check_each_pass:
  title: "Re-check with each new radar Pass"
  what: "NISAR passes every 12 days. Look at this place again after each Pass: new damage from aftershocks, or ground that keeps moving, shows up within two weeks."
  cost: low
  source: "Team practice; NISAR repeats every 12 days"
  check: "Compare the answer with the previous Pass."

rebuild_to_code:
  title: "Rebuild to the seismic building code"
  what: "The ground here was shaken but not bent or torn: rebuild with the code's seismic design for the zone and soil. Most collapses come from buildings that did not follow it."
  cost: medium
  source: "COVENIN 1756-1:2001, Edificaciones Sismorresistentes (Venezuela)"
  check: "Soil type for the plot (the code's soil profile), as required for any building permit."

site_study_first:
  title: "Geotechnical site study before rebuilding"
  what: "Boreholes or geophysics to check for cracked ground, loosened soil or a fault branch before a new foundation is designed."
  cost: medium
  source: "General geotechnical practice; COVENIN 1756-1:2001 requires site studies for special soils"
  check: "Open cracks in the ground, tilted walls or broken pipes nearby."

fault_setback:
  title: "Keep new buildings off the torn strip"
  what: "Where the ground broke or bent sharply, do not rebuild across it. A fault study locates the trace and sets a setback; the strip can become a park, road or open space."
  cost: high
  source: "Alquist-Priolo Earthquake Fault Zoning Act (California, 1972): buildings may not straddle active fault traces"
  check: "Trenching or geophysics across the strip to find the fault trace."

slope_check_before_rain:
  title: "Inspect shaken slopes before the rainy season"
  what: "Earthquakes crack steep slopes that then slide in the next heavy rain. Walk the slopes above homes and roads for fresh cracks and drain the water away from them."
  cost: low
  source: "Keefer, D. K. (1984). Landslides caused by earthquakes. GSA Bulletin 95; Vargas 1999 debris flows (Venezuela) as a local reminder"
  check: "Fresh cracks at the top of slopes, leaning trees or walls, muddy springs."

crack_gauges:
  title: "Install crack gauges or survey points"
  what: "Simple gauges across wall cracks, or a few survey points, show within weeks whether movement continues, between radar Passes and at the scale of one building."
  cost: low
  source: "General monitoring practice for slow-moving ground"
  check: "Read the gauges weekly; act if cracks keep opening."

inspect_section:
  title: "Inspect the section before full use"
  what: "Walk or drive the flagged section: pavement cracks and steps, tunnel linings, and under the road the water, sewer and gas pipes, which break where the ground bends or tears."
  cost: medium
  source: "American Lifelines Alliance (2005). Seismic Guidelines for Water Pipelines"
  check: "Leak tests on the pipes under the road; pressure drops reported by the utility."

flexible_pipe_joints:
  title: "Flexible or restrained joints where pipes cross moving ground"
  what: "When repairing pipes across torn or moving ground, use joints that can stretch and rotate, or ductile pipe, so the next earthquake or creep does not break them again."
  cost: medium
  source: "American Lifelines Alliance (2005). Seismic Guidelines for Water Pipelines; O'Rourke and Liu (1999), MCEER Monograph 3"
  check: "Where exactly the ground moved along the pipe route (this map, then a survey)."
